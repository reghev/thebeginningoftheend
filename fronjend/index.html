<!DOCTYPE html>
<html>

<head>
  <title>raghav.beer</title>
  <link rel="icon" type="image/png" href="image.s/MISSING.png">
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="hero">
    <main>
      <p>How many days till raghav can drink?</p>
      <p id="demo"></p>
    </main>
  </div>
  <section class="guestbook" id="guestbook">
    <div class="gb-inner">

      <div class="gb-title-wrap">
        <h1 class="gb-title">guest book</h1>
      </div>
      <p class="gb-subtitle"><span class="gb-shiny">So, what did you think?</span></p>

      <div class="gb-card gb-form-card">
        <h2 class="gb-card-title">Sign the Guest Book</h2>
        <form id="gbForm">
          <div class="gb-field">
            <label for="gbMessage">Message</label>
            <textarea id="gbMessage" rows="4" maxlength="500"
              placeholder="what were your thoughts, what should i add?"></textarea>
            <p class="gb-count"><span id="gbCharCount">0</span>/500 characters</p>
          </div>
          <div class="gb-field">
            <label for="gbName">Name</label>
            <input id="gbName" type="text" maxlength="50" placeholder="sign here">
          </div>
          <button id="gbSubmit" type="submit" disabled>Sign Guest Book</button>
          <p id="gbStatus" class="gb-status"></p>
        </form>
      </div>

      <h2 class="gb-count-heading" id="gbCount">0 Signatures</h2>

      <div id="gbLoading" class="gb-loading">
        <div class="gb-spinner"></div>
        <p id="gbLoadingText"></p>
      </div>

      <div id="gbList"></div>

    </div>
  </section>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-grid">

        <div class="footer-brand">
          <div class="footer-logo-row">
            <div class="logo-swap" id="logoSwap" role="button" tabindex="0" aria-label="Switch logo">
              <img class="logo-a" src="image.s/FOUND.png" alt="Logo" width="48" height="48">
              <img class="logo-b" src="image.s/MISSING.png" alt="" width="48" height="48">
            </div>
            <h3 class="footer-title">raghav.fit</h3>
          </div>
          <p id="footerRandom" class="footer-tagline"></p>
        </div>

        <div>
          <h3 class="footer-heading">Navigation</h3>
          <div class="footer-links">
            <a href="https://raghav.fit/">My website</a>
          </div>
        </div>

        <div>
          <h3 class="footer-heading">Connect</h3>
          <div class="footer-links">
            <a href="https://github.com/reghev" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/raghav-madiraju-1363bb338" target="_blank"
              rel="noopener noreferrer">LinkedIn</a>
            <a href="mailto:raghavmadiraju@gmail.com">Email</a>
            <a href="https://www.instagram.com/reghevbetta" target="_blank" rel="noopener noreferrer">Instagram</a>
          </div>
        </div>

      </div>

      <div class="footer-bottom">
        <p class="footer-copy">&copy; 2026 raghav.fit &middot; Built with HTML &amp; CSS</p>
      </div>
    </div>
  </footer>

  <script>
    // Guestbook
    var loadingMessages = [
      "selecting entries that benefit me...", "reading your minds...",
      "judging your opinions...", "searching for compliments...",
      "decoding your messages...",
      "processing your thoughts...",
    ];
    document.getElementById("gbLoadingText").textContent =
      loadingMessages[Math.floor(Math.random() * loadingMessages.length)];

    var gbName = document.getElementById("gbName");
    var gbMessage = document.getElementById("gbMessage");
    var gbSubmit = document.getElementById("gbSubmit");
    var gbStatus = document.getElementById("gbStatus");

    function updateGbForm() {
      document.getElementById("gbCharCount").textContent = gbMessage.value.length;
      gbSubmit.disabled = !gbName.value.trim() || !gbMessage.value.trim();
    }
    gbName.addEventListener("input", updateGbForm);
    gbMessage.addEventListener("input", updateGbForm);

    function formatGbDate(ms) {
      return new Date(ms).toLocaleDateString("en-US", {
        month: "short", day: "numeric", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    async function loadGuestbook() {
      var loading = document.getElementById("gbLoading");
      var list = document.getElementById("gbList");
      var entries = [];
      try {
        entries = await fetch("/api/guestbook").then(function (r) { return r.json(); });
      } catch (e) {
        console.log("Loading entries:", e);
      }
      loading.style.display = "none";

      document.getElementById("gbCount").textContent =
        entries.length + (entries.length === 1 ? " Signature" : " Signatures");

      list.innerHTML = "";

      if (!entries.length) {
        var empty = document.createElement("div");
        empty.className = "gb-card gb-empty";
        var ep = document.createElement("p");
        ep.textContent = "No signatures yet. Be the first to sign!";
        empty.appendChild(ep);
        list.appendChild(empty);
        return;
      }

      entries.forEach(function (e) {
        var card = document.createElement("div");
        card.className = "gb-card gb-entry";

        var who = document.createElement("h3");
        who.textContent = e.name;            // textContent, never innerHTML

        var when = document.createElement("p");
        when.className = "gb-date";
        when.textContent = formatGbDate(e.created_at);

        var msg = document.createElement("p");
        msg.className = "gb-message";
        msg.textContent = e.message;

        card.append(who, when, msg);
        list.appendChild(card);
      });
    }

    document.getElementById("gbForm").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      gbSubmit.disabled = true;
      gbSubmit.textContent = "Signing...";
      gbStatus.textContent = "";

      try {
        var res = await fetch("/api/guestbook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: gbName.value, message: gbMessage.value })
        });
        var data = await res.json();

        if (!res.ok) {
          gbStatus.textContent = data.error;
        } else {
          gbName.value = "";
          gbMessage.value = "";
          gbStatus.textContent = "Thanks for signing!";
          loadGuestbook();
        }
      } catch (e) {
        gbStatus.textContent = "Failed to save your entry. Please try again!";
      }

      gbSubmit.textContent = "Sign Guest Book";
      updateGbForm();
    });

    loadGuestbook();

    // Footer random text
    var phrases = [
      "building legos", "poorly coding stuff", "doing things", "being here",
      "playing stanley parable", "burning things", "lifting",
      "listening to nirvana", "thinking about food", "avoiding homework",
      "daydreaming about hackclub", "looking at fender custom shop",
      "waiting for summer", "playing bass", "pcpartpicker connoisseur", "reading comics"
    ];
    document.getElementById("footerRandom").textContent =
      phrases[Math.floor(Math.random() * phrases.length)] + " since a little bit ago";

    // Countdown
    // taken from https://www.w3schools.com/howto/howto_js_countdown.asp slightly edited
    var countDownDate = new Date("2032-12-29T03:00:00-05:00").getTime();
    var offset = 0; // how far the visitor's clock is from the server's

    async function syncClock() {
      try {
        const t0 = Date.now();
        const data = await fetch("/api/time", { cache: "no-store" }).then(r => r.json());
        const t1 = Date.now();
        offset = data.now + (t1 - t0) / 2 - t1;
        countDownDate = data.target;
      } catch (e) {
        console.log("Clock sync failed, using local time", e);
      }
    }

    function tick() {
      var now = Date.now() + offset;
      var distance = countDownDate - now;

      if (distance <= 0) {
        document.getElementById("demo").innerHTML = "EXPIRED";
        return;
      }

      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("demo").innerHTML =
        days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

      // Schedule the next tick for the start of the next second
      setTimeout(tick, 1000 - (now % 1000));
    }

    syncClock().then(tick);
    setInterval(syncClock, 5 * 60 * 1000); // re-sync every 5 minutes
  </script>
</body>

</html>
